reviews:
  - { name: "Kévin Lainé", role: "Appartement haussmannien, Paris", text: "Nous avons sollicité Fabrice et ses équipes pour l'installation d'une climatisation dans les chambres de notre appartement haussmannien. Après deux prévisites et des discussions passionnées sur les possibilités et contraintes du chantier, l'installation a eu lieu dans le délai annoncé et avec le résultat escompté : le plus invisible possible." }
  - { name: "Laurent Olivier", role: "Appartement de 110 m², Paris", text: "Travail très professionnel, équipe à l'écoute et soigneuse, avec une vraie réflexion sur l'intégration de l'installation dans mon appartement, qui n'était pas évidente. Pas de casse, pas de raccord moche, un choix du passage des gaines et des trappes d'accès super optimisé. Le résultat est à la fois discret, propre et parfaitement adapté à mon intérieur." }
  - { name: "Tigrane Petrossian", role: "Client particulier", text: "Honnêteté, expertise et compétence. La recommandation des appareils, le service, la prise en charge des imprévus. Professionnels jusqu'au bout. Une entreprise orientée satisfaction client, un patron présent et impliqué, qui s'est entouré de professionnels efficaces et volontaires. Merci et bravo." }
  - { name: "Jerome de Preneuf", role: "Client particulier", text: "Fabrice et son équipe sont de très grands professionnels, très sérieux et très compétents. Ils savent trouver des solutions pour installer la climatisation en écoutant le client tout en se montrant innovants. Un travail parfait, des collaborateurs fiables et respectueux qui prennent soin des lieux. Une installation réussie, dans les délais et le budget impartis." }
  - { name: "Hélène", role: "Rénovation, client particulier", text: "Pilotech est une entreprise extrêmement professionnelle que je ne peux que recommander. Depuis la première prise de contact, les visites de devis, la planification et la réalisation des travaux, tout s'est fait avec la plus grande écoute, précision et diligence. Pour avoir fait réaliser au moins quatre autres devis avant de choisir Pilotech, je peux garantir que les entrepreneurs de cette qualité sont bien rares." }
  - { name: "Christophe Terrasse", role: "Appartement sous les toits", text: "Travail très soigné. Beaucoup de temps et d'efforts pour trouver la meilleure solution pour installer la climatisation de mon appartement sous les toits. Fabrice est toujours disponible et à l'écoute, et le chantier mené par Alex s'est parfaitement déroulé. À conseiller pour tous les anxieux et les phobiques des travaux !" }
  - { name: "A L", role: "Appartement parisien", text: "Pilotech vient d'installer une climatisation dans mon appartement parisien. Le responsable et son équipe ont été très attentifs et ont répondu à mes attentes. Une équipe très compétente et efficace, un travail de qualité, de plus très respectueux et agréables dans nos échanges. De bons professionnels que je recommande." }
  - { name: "Lucas", role: "Client particulier", text: "Fabrice prend vraiment le temps d'étudier le projet afin de proposer la solution la plus pertinente. Une fois trouvée, ses ouvriers sont d'une efficacité redoutable pour la mettre en place. Il ne reste aucune trace de leur passage, à part les consoles de clim." }
  - { name: "Bistrot de l'Oulette", role: "Restaurant, Paris", text: "Merci Fabrice pour votre professionnalisme et la qualité de votre travail. Installation impeccable, rapide et soignée dans notre restaurant. Je recommande sans hésitation !" }
  - { name: "Michel Sebag", role: "Boutique de bijoux", text: "Une équipe très sérieuse. Installation compliquée sur une boutique de bijoux, tout a été réalisé parfaitement bien. Ils sont très pointilleux." }
  - { name: "Linda A", role: "Première cuisine", text: "L'équipe Pilotech a réalisé un magnifique travail pour ma première cuisine. Des professionnels à l'écoute de leur client, ponctuels, qui travaillent proprement avec du matériel de qualité et un timing plus que respecté. Je recommande pour vos travaux. Merci encore." }
  - { name: "Claire Parisot", role: "Maison de campagne", text: "Restauration d'une maison de campagne. Travail sérieux, Pilotech à votre écoute. Je suis ravie du travail effectué, ça a tout changé, ça fait classe tout en ayant le charme de l'ancien." }
  - { name: "Lysette Martin", role: "Salle de bain, Coulommiers", text: "M. Gibier a été très à l'écoute de notre demande pour une installation très rapide, afin que maman puisse prendre une douche de façon sécurisée. Daniel, l'installateur, a pris toutes les précautions pour protéger la salle de bain de la poussière, et il a su être patient face à nos questions. Nous recommandons fortement." }
  - { name: "Amina Chaouch", role: "Cliente particulière", text: "Un grand merci à l'équipe de Pilotech pour leur professionnalisme et leur efficacité. Travail impeccable, continuez comme ça !" }
  - { name: "Floriana Pacelli", role: "Cliente particulière", text: "Excellent travail de la société Pilotech, ils sont précis, compétents et le résultat final est de grande qualité !" }

